[package]
name = "rust_parsers"
version = "0.1.0"
edition = "2024"

[dependencies]
oxc_allocator = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"

swc_ecma_parser = { version = "=46.0.0", features = ["typescript"] }
swc_common = "=26.0.0"

mimalloc = { package = "mimalloc-safe", version = "0.1.52" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
debug         = false
panic         = "abort"
