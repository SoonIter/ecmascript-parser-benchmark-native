[package]
name = "swc_next_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
# Benchmark the published crates.io release, without a local SWC Next checkout.
swc_next_allocator = "=0.2.4"
swc_next_ecma_ast = "=0.2.4"
swc_next_ecma_parser = "=0.2.4"
swc_next_ecma_semantic = "=0.2.4"

mimalloc = { package = "mimalloc-safe", version = "0.1.52" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
debug         = false
panic         = "abort"
