[package]
name = "swc_next_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
# Benchmark the published crates.io release, without a local SWC Next checkout.
swc_next_allocator = "=0.3.1"
swc_next_ecma_ast = "=0.3.1"
swc_next_ecma_parser = "=0.3.1"
swc_next_ecma_semantic = "=0.3.1"

mimalloc = { package = "mimalloc-safe", version = "0.1.67" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
debug         = false
panic         = "abort"
